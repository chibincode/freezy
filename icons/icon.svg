<?xml version="1.0" encoding="UTF-8"?>
<!--
  Freezy's toolbar icon: a hover hand — the thing the extension holds still.
  The frozen state is carried by the badge (a ❄ character set from background.js),
  so this mark stays one shape and reads at 16px.

  Source of truth for icons/icon16.png, icon32.png, icon48.png and icon128.png.
  Export at those four sizes on a transparent background. With librsvg:
      rsvg-convert -w 128 -h 128 icons/icon.svg -o icons/icon128.png
  Or with nothing but macOS (width/height above are why this fills the frame):
      qlmanage -t -s 128 -o /tmp/out icons/icon.svg
  #2f9fe8 is the badge blue; it holds up on both light and dark toolbar themes.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="512" height="512" role="img" aria-label="Freezy">
  <g transform="translate(12 12) scale(1.0) translate(-13.1 -12.2)"
     fill="none" stroke="#2f9fe8" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
    <path d="M16.2 11.6v-1a1.8 1.8 0 0 1 3.6 0V15a6.6 6.6 0 0 1-6.6 6.6h-1.1a6 6 0 0 1-4.25-1.76l-3.2-3.2a1.85 1.85 0 0 1 2.62-2.62L9 15.6V11"
          fill="#2f9fe8" fill-opacity="0.16"/>
    <path d="M9 11.5V4.6a1.8 1.8 0 0 1 3.6 0V11"/>
    <path d="M12.6 11V9.3a1.8 1.8 0 0 1 3.6 0V11"/>
  </g>
</svg>
